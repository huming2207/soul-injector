name: STM32WLE5CC
variants:
  - name: STM32WLE5CC
    package_variants:
      - STM32WLE5CCUx
    cores:
      - name: main
        type: armv7em
        core_access_options: !Arm
          ap: !v1 0
    memory_map:
      - !Nvm
        name: BANK_1
        range:
          start: 0x8000000
          end: 0x8040000
        cores:
          - main
        access:
          write: false
          boot: true
      - !Ram
        name: SRAM1
        range:
          start: 0x20000000
          end: 0x20008000
        cores:
          - main
      - !Ram
        name: SRAM2
        range:
          start: 0x20008000
          end: 0x20010000
        cores:
          - main
    flash_algorithms:
      - algorithm
flash_algorithms:
  - name: algorithm
    description: ''
    default: true
    instructions: 
    load_address: 0x20000020
    pc_init: 0x10d
    pc_uninit: 0x2fd
    pc_program_page: 0x1c1
    pc_erase_sector: 0x51
    pc_erase_all: 0x1
    pc_verify: 0x315
    data_section_offset: 0x20001bec
    rtt_poll_interval: 0
    flash_properties:
      address_range:
        start: 0x8000000
        end: 0x8040000
      page_size: 0x800
      erased_byte_value: 0xff
      program_page_timeout: 1000
      erase_sector_timeout: 2000
      sectors:
        - size: 0x800
          address: 0x0
    cores:
      - main

self_tests:
  - name: LoRa send
    type: simple
    addr: 0xfffff006