image: ubuntu:24.04

workflow:
  rules:
    - if: '$CI_COMMIT_TAG != null && $CI_COMMIT_BRANCH == null'

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  # Optimization: Use local directories for APT, PIP, and CCache
  APT_CACHE_DIR: "$CI_PROJECT_DIR/.cache/apt"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  CCACHE_DIR: "$CI_PROJECT_DIR/.ccache"
  IDF_PATH: "$CI_PROJECT_DIR/esp/idf"
  IDF_TOOLS_PATH: "$CI_PROJECT_DIR/esp"
  # Ccache is installed, enable it by default
  IDF_CCACHE_ENABLE: "1"

build:
  stage: build
  #Use a longrunning-tagged runner because this is a long job.
  tags:
    - longrunning

  parallel:
    matrix:
      - SI_HW_REV: rev3
      - SI_HW_REV: rev5

  variables:
    # To build the image for a branch or a tag of IDF, pass --build-arg IDF_CLONE_BRANCH_OR_TAG=name.
    # To build the image with a specific commit ID of IDF, pass --build-arg IDF_CHECKOUT_REF=commit-id.
    # It is possibe to combine both, e.g.:
    #   IDF_CLONE_BRANCH_OR_TAG=release/vX.Y
    #   IDF_CHECKOUT_REF=<some commit on release/vX.Y branch>.
    # Use IDF_CLONE_SHALLOW=1 to peform shallow clone (i.e. --depth=1 --shallow-submodules)
    # Use IDF_INSTALL_TARGETS to install tools only for selected chip targets (CSV)
    IDF_CLONE_URL: "https://github.com/espressif/esp-idf.git"
    IDF_CLONE_BRANCH_OR_TAG: "v6.0.1"
    IDF_CLONE_SHALLOW: "1"
    IDF_INSTALL_TARGETS: "esp32s3"

    # The constraint file has been downloaded and the right Python package versions installed. No need to check and
    # download this at every invocation of the container.
    IDF_PYTHON_CHECK_CONSTRAINTS: "yes"

  cache:
    key: "esp-idf-v6.0-v3"
    paths:
      - $IDF_PATH
      - $IDF_TOOLS_PATH
      - $APT_CACHE_DIR
      - $PIP_CACHE_DIR
      - $CCACHE_DIR

  before_script:
    # Update and install dependencies using the restored APT cache
    - mkdir -p "$APT_CACHE_DIR/archives/partial" "$APT_CACHE_DIR/lists/partial"
    - export APT_OPTS="-o Dir::Cache::Archives=$APT_CACHE_DIR/archives -o Dir::State::Lists=$APT_CACHE_DIR/lists"
    - apt-get $APT_OPTS update
    - apt-get $APT_OPTS install -y
        apt-utils bison ca-certificates ccache check curl flex git git-lfs gperf 
        lcov libbsd-dev libffi-dev libncurses-dev libusb-1.0-0-dev make 
        ninja-build python3 python3-venv ruby unzip wget xz-utils zip
    - update-alternatives --install /usr/bin/python python /usr/bin/python3 10

    # Verify and clone ESP-IDF if necessary
    - |
      if [ ! -f "$IDF_PATH/tools/idf_tools.py" ]; then
        echo "ESP-IDF is missing or corrupted. Cloning fresh copy..."
        git clone --recursive --jobs=16 --depth=1 --shallow-submodules \
          -b $IDF_CLONE_BRANCH_OR_TAG $IDF_CLONE_URL $IDF_PATH
      fi

    # Install ESP-IDF tools
    - |
      update-ca-certificates --fresh
      $IDF_PATH/tools/idf_tools.py --non-interactive install required --targets=${IDF_INSTALL_TARGETS}
      $IDF_PATH/tools/idf_tools.py --non-interactive install cmake
      $IDF_PATH/tools/idf_tools.py --non-interactive install-python-env

    - . $IDF_PATH/export.sh
    - cd $CI_PROJECT_DIR

  script:
    - mkdir -p "build-$SI_HW_REV"
    - idf.py -B "build-$SI_HW_REV" -D "SI_HW_REV=$SI_HW_REV" -D "SDKCONFIG=$CI_PROJECT_DIR/build-$SI_HW_REV/sdkconfig" set-target esp32s3
    - idf.py -B "build-$SI_HW_REV" -D "SI_HW_REV=$SI_HW_REV" -D "SDKCONFIG=$CI_PROJECT_DIR/build-$SI_HW_REV/sdkconfig" build

  after_script:
    # Cache ESP-IDF, tools, and APT data
    - rm -rf "$IDF_TOOLS_PATH/dist"
    - apt-get $APT_OPTS autoclean

  artifacts:
    name: "soulinjector-${SI_HW_REV}-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - build-$SI_HW_REV/*.bin
      - build-$SI_HW_REV/bootloader/*.bin
      - build-$SI_HW_REV/partition_table/*.bin
      - build-$SI_HW_REV/flasher_args.json
